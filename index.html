<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity CRT | Albert Pikes</title>
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f6ac.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --pure-white: #ffffff;
            --neon-glow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body, html { 
            margin: 0; padding: 0; background: #000; 
            font-family: 'Inter', sans-serif; height: 100vh; 
            color: var(--pure-white); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .scrolling-text {
            position: absolute; width: 100%; white-space: nowrap;
            overflow: hidden; font-family: 'Courier New', monospace;
            font-size: 0.7rem; letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.4); z-index: 5;
            text-transform: uppercase;
        }
        .top-scroll { top: 15px; animation: scroll-left 25s linear infinite; }
        .bottom-scroll { bottom: 15px; animation: scroll-right 25s linear infinite; }

        @keyframes scroll-left { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes scroll-right { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .tv-container {
            position: relative; width: 95vw; height: 90vh;
            perspective: 1200px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        .screen-curved {
            position: relative; width: 100%; height: 100%;
            background: #000; border-radius: 45% / 10%; 
            overflow: hidden; box-shadow: 0 0 150px rgba(0, 0, 0, 1) inset;
            transform: rotateX(1deg); display: flex; justify-content: center; align-items: center;
            mask-image: radial-gradient(circle, black 80%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 80%, transparent 100%);
        }

        #bgVideo { 
            width: 115%; height: 115%; object-fit: cover; 
            filter: brightness(0.3) contrast(1.2); 
            position: absolute; z-index: 1; transition: opacity 0.5s ease; 
        }

        /* MERKEZ PANEL */
        .profile-container { 
            position: relative; z-index: 10; text-align: center; 
            width: 320px; display: flex; flex-direction: column; align-items: center; 
        }
        
        .avatar { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.4); margin-bottom: 15px; 
            box-shadow: var(--neon-glow); object-fit: cover; 
        }

        h1 { font-size: 1.6rem; letter-spacing: 8px; margin-bottom: 20px; text-shadow: var(--neon-glow); }

        .link-box { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 30px; }
        
        .btn { 
            padding: 14px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); border-radius: 4px; 
            color: var(--pure-white); text-decoration: none; font-size: 0.75rem; 
            letter-spacing: 3px; transition: 0.4s; text-transform: uppercase; 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
        }
        .btn:hover { 
            background: rgba(255, 255, 255, 0.1); border-color: #fff; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); 
        }

        .volume-section { 
            width: 100%; margin-bottom: 35px; display: flex; 
            align-items: center; gap: 12px; opacity: 0.6; transition: 0.3s; 
        }
        .volume-section:hover { opacity: 1; }
        
        input[type=range] { flex-grow: 1; accent-color: #fff; cursor: pointer; height: 2px; }

        .video-selector-inline { display: flex; gap: 20px; justify-content: center; }
        
        .v-btn { 
            width: 40px; height: 40px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0, 0, 0, 0.5); color: #555; cursor: pointer; 
            font-family: 'Courier New', monospace; font-size: 1rem; 
            transition: 0.4s; display: flex; align-items: center; justify-content: center; 
        }
        .v-btn.active { 
            border-color: var(--pure-white); color: var(--pure-white); 
            text-shadow: var(--neon-glow); transform: scale(1.1); 
        }
    </style>
</head>
<body>

    <div class="tv-container">
        <div class="screen-curved">
            <div class="scrolling-text top-scroll">ALBERT WEB HACK // ALBERT WEB HACK // ALBERT WEB HACK // ALBERT WEB HACK //</div>
            <div class="scrolling-text bottom-scroll">ALBERT WEB HACK // ALBERT WEB HACK // ALBERT WEB HACK // ALBERT WEB HACK //</div>

            <video id="bgVideo" loop playsinline autoplay muted>
                <source src="video1.mp4" type="video/mp4">
            </video>
            
            <div class="profile-container">
                <img src="profil.jpg" alt="P" class="avatar" onerror="this.src='https://via.placeholder.com/150'">
                <h1>ALBERT PIKES</h1>

                <div class="link-box">
                    <a href="https://wa.me/+972568144659" class="btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                    <a href="https://t.me/taylandpublics" class="btn"><i class="fab fa-telegram-plane"></i> Telegram</a>
                    <a href="#" class="btn"><i class="fab fa-github"></i> Repository</a>
                </div>

                <div class="volume-section">
                    <i class="fas fa-volume-down" style="font-size: 0.7rem;"></i>
                    <input type="range" id="volumeSlider" min="0" max="100" value="0">
                    <i class="fas fa-volume-up" style="font-size: 0.7rem;"></i>
                </div>

                <div class="video-selector-inline">
                    <button class="v-btn active" onclick="changeVideo('video1.mp4', this)">1</button>
                    <button class="v-btn" onclick="changeVideo('video2.mp4', this)">2</button>
                    <button class="v-btn" onclick="changeVideo('video3.mp4', this)">3</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const volumeSlider = document.getElementById('volumeSlider');

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value / 100;
            video.muted = (video.volume === 0);
        });

        function changeVideo(path, btn) {
            document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            video.style.opacity = '0';
            setTimeout(() => {
                video.pause();
                video.src = path;
                video.load();
                video.onloadeddata = () => {
                    video.volume = volumeSlider.value / 100;
                    video.play();
                    video.style.opacity = '1';
                };
            }, 400);
        }
    </script>
</body>
</html>
